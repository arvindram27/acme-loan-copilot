name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme_local_dev
          POSTGRES_DB: agentmem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acme -d agentmem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEM_DATABASE_URL: postgresql://acme:acme_local_dev@127.0.0.1:5432/agentmem
      MEM_DATABASE_URL_LG: postgresql://acme:acme_local_dev@127.0.0.1:5432/agentmem_lg
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Create the second database
        run: |
          uv run python - <<'PY'
          import os, psycopg
          base = os.environ["MEM_DATABASE_URL"].rsplit("/", 1)[0]
          with psycopg.connect(base + "/postgres", autocommit=True) as c:
              if not c.execute("SELECT 1 FROM pg_database WHERE datname='agentmem_lg'").fetchone():
                  c.execute("CREATE DATABASE agentmem_lg")
          PY

      - name: Apply migrations
        run: |
          uv run python -m agentmem.db
          uv run python -c "
          from agentmem.db import migrate
          from agentmem.settings import get_settings
          print(migrate(get_settings().database_url_lg))
          "

      - name: Offline tests (no paid calls)
        run: uv run pytest -m "not live"
