[project]
name = "agentmem"
version = "0.1.0"
description = "Agent memory built twice: scratch SQL on Postgres vs LangGraph, measured. Acme Home Loans loan-officer copilot."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "orjson>=3.10",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
