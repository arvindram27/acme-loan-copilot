<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}Acme Loan Copilot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Acme&nbsp;Home&nbsp;Loans — Copilot</span>

  <main>
    {% block content %}{% endblock %}

</body>
</html>
